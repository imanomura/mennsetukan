<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面接タイムスタンプ & 動画区切り記録ツール</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        max-width: 1400px;
        margin: 0 auto;
        padding: 15px;
        background-color: #f4f6f8;
        color: #333;
      }
      h1 {
        border-bottom: 3px solid #3182ce;
        padding-bottom: 8px;
        color: #2b6cb0;
        font-size: 22px;
        margin-top: 0;
      }
      .card {
        background: white;
        padding: 15px 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        margin-bottom: 15px;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      input[type='text'] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        padding: 8px 14px;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-set {
        background-color: #3182ce;
        color: white;
      }
      .btn-undo {
        background-color: #e53e3e;
        color: white;
      }
      .btn-csv {
        background-color: #319795;
        color: white;
        font-size: 15px;
        padding: 10px 18px;
      }

      /* 質問ボタンのスタイル */
      .btn-q {
        background-color: #ed8936;
        color: white;
        margin-right: 6px;
      }
      .btn-q.recorded {
        background-color: #c05621;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      .btn-a {
        background-color: #38a169;
        color: white;
      }
      .btn-a.recorded {
        background-color: #22543d;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      /* ★レイアウト分割（左右2カラム構造） */
      .main-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .main-container {
          grid-template-columns: 1fr; /* 画面が狭い場合は1列化 */
        }
      }

      /* ★画面スクロール時も動画エリアを左側に追従固定 */
      .sticky-video-card {
        position: sticky;
        top: 15px; /* 画面最上部から15pxの位置で固定 */
        z-index: 100;
      }

      .video-section {
        background-color: #1a202c;
        padding: 12px;
        border-radius: 6px;
        color: white;
      }
      video {
        width: 100%;
        max-height: 480px;
        background: black;
        border-radius: 4px;
        display: block;
      }

      .question-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .q-title {
        font-weight: bold;
        width: 65px;
        font-size: 15px;
      }
      .recorded-time-label {
        font-size: 12px;
        color: #4a5568;
        margin-top: 4px;
      }
      .q-script {
        flex-basis: 100%;
        background: #fffaf0;
        border-left: 4px solid #ed8936;
        padding: 8px 12px;
        margin-bottom: 8px;
        font-size: 14px;
        line-height: 1.6;
      }
      .script-box {
        background: #ebf8ff;
        border-left: 4px solid #3182ce;
        padding: 8px 12px;
        margin: 10px 0;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <h1>🎙️ 面接タイムスタンプ & 動画区切り記録ツール</h1>

    <!-- 1. ヘッダー：セッションID設定 -->
    <div class="card">
      <div class="flex-between">
        <div>
          <label for="session-id" style="font-weight: bold">被験者ID (セッション): </label>
          <input type="text" id="session-id" value="user_001" placeholder="例: user_001" />
          <button class="btn-set" onclick="initSession()">確定・開始</button>
        </div>
        <div>
          <button class="btn-undo" id="btn-undo-top" onclick="undoLastOperation()" disabled>↩️ Undo (取り消し)</button>
          <button class="btn-csv" id="btn-csv-top" onclick="downloadCSV()" disabled>📥 CSV出力</button>
        </div>
      </div>
      <p id="session-status" style="margin: 6px 0 0 0; color: #e53e3e; font-weight: bold; font-size: 13px">
        ※「確定・開始」ボタンを押すまで操作できません。
      </p>
    </div>

    <!-- 2. メインエリア（左：固定動画 / 右：質問記録ボタン） -->
    <div class="main-container">
      <!-- 左カラム：画面スクロールしても最上部に固定される動画プレイヤー -->
      <div class="card sticky-video-card">
        <h3 style="margin-top: 0; margin-bottom: 8px; color: #2b6cb0">📹 面接録画動画</h3>
        <p style="margin: 0 0 8px 0; font-size: 12px; color: #4a5568">
          動画を読み込んで再生しながら、右側のボタンを押すと再生位置（秒数）を直接記録できます。
        </p>
        <input
          type="file"
          id="video-input"
          accept="video/*"
          onchange="loadVideo(event)"
          style="margin-bottom: 8px; font-size: 12px"
        />

        <div class="video-section">
          <video id="video-player" controls></video>
          <div style="margin-top: 8px; font-weight: bold; color: #cbd5e0; font-size: 14px" id="video-time-display">
            再生位置: 00:00.0 (0.00秒)
          </div>
        </div>
      </div>

      <!-- 右カラム：質問コントロール（スクロール可能） -->
      <div class="card">
        <h2 style="margin-top: 0; font-size: 18px; color: #2d3748">質問コントロール (全9問)</h2>
        <div class="script-box">面接官「おはようございます。音声聞こえていますでしょうか」</div>
        <div id="questions-container"></div>
        <div class="script-box">
          {% raw
          %}面接官「ありがとうございます。これで面接は終わりです。本日はありがとうございました。お疲れ様でした。○○さんの方から退出ボタンを押して退出していただいてかまいません」{%
          endraw %}
        </div>
        <div id="completion-notice" style="margin-top: 15px"></div>
      </div>
    </div>

    <script>
      const QUESTION_TEXTS = {
        1: 'ありがとうございます。では、面接を始めさせていただきます。1分程度で趣味や特技、大学で学んでいることを交えて簡単に自己紹介をして下さい',
        2: 'ありがとうございます。では次に、志望動機を教えてください',
        3: '弊社を知ったきっかけを教えてください',
        4: '学生時代力を入れたことを教えてください',
        5: 'あなたの長所とその長所が表れた経験を教えてください',
        6: 'あなたの短所とその短所を解決するために取り組んでいることを教えてください',
        7: '人生で挫折した経験を教えて下さい',
        8: 'あなたの就職活動の軸を教えてください',
        9: '5年後、10年後に弊社でどう成長していたいか、ビジョンをお願いします'
      };
      let currentSessionId = '';
      let isSessionActive = false;
      const videoPlayer = document.getElementById('video-player');

      // 動画時間の同期表示
      videoPlayer.ontimeupdate = function () {
        const sec = videoPlayer.currentTime;
        const m = Math.floor(sec / 60)
          .toString()
          .padStart(2, '0');
        const s = (sec % 60).toFixed(1).padStart(4, '0');
        document.getElementById('video-time-display').innerText = `再生位置: ${m}:${s} (${sec.toFixed(2)}秒)`;
      };

      // 動画読み込み処理（オブジェクトURL解放・エラーハンドリング付）
      function loadVideo(event) {
        const file = event.target.files[0];
        if (!file) return;

        if (videoPlayer.src && videoPlayer.src.startsWith('blob:')) {
          URL.revokeObjectURL(videoPlayer.src);
        }

        const videoURL = URL.createObjectURL(file);
        videoPlayer.src = videoURL;
        videoPlayer.load();

        videoPlayer.onloadedmetadata = function () {
          videoPlayer.currentTime = 0;
        };

        videoPlayer.onerror = function () {
          alert(
            '⚠️ 動画を表示できませんでした。H.264形式の.mp4ファイルでお試しいただくか、Safari等の別ブラウザをご利用ください。'
          );
        };
      }

      window.onload = function () {
        generateQuestionRows();
      };

      // セッション確定
      async function initSession() {
        const inputVal = document.getElementById('session-id').value.trim();
        if (!inputVal) {
          alert('セッションIDを入力してください。');
          return;
        }
        try {
          const res = await fetch('/api/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: inputVal })
          });
          const data = await res.json();
          if (data.session_id) {
            currentSessionId = data.session_id;
            isSessionActive = true;
            document.getElementById('session-status').innerText = `✅ セッション設定完了: ${currentSessionId}`;
            document.getElementById('session-status').style.color = '#2b6cb0';
            toggleControlButtons(true);
            refreshEventsList();
          }
        } catch (err) {
          alert('通信エラーが発生しました。');
        }
      }

      function toggleControlButtons(enable) {
        document.getElementById('btn-undo-top').disabled = !enable;
        document.getElementById('btn-csv-top').disabled = !enable;
        for (let i = 1; i <= 9; i++) {
          document.getElementById(`btn-q-${i}`).disabled = !enable;
          document.getElementById(`btn-a-${i}`).disabled = !enable;
          document.getElementById(`btn-manual-${i}`).disabled = !enable;
        }
      }

      // 9問分のUI要素生成
      function generateQuestionRows() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
          const row = document.createElement('div');
          row.className = 'question-row';
          row.innerHTML = `
              <div class="q-script">面接官「${QUESTION_TEXTS[i]}」</div>   <!-- ★この1行を追加 -->
              <div class="q-title">質問 ${i}</div>
              <div>
                  <button class="btn-q" id="btn-q-${i}" onclick="recordEvent(${i}, 'interviewer_question_end')" disabled>質問終了</button>
                  <button class="btn-a" id="btn-a-${i}" onclick="recordEvent(${i}, 'participant_answer_end')" disabled>解答終了</button>
              </div>
              <div style="text-align: right;">
                  <button id="btn-manual-${i}" onclick="manualTimeInput(${i})" style="font-size: 11px; background: #e2e8f0;" disabled>✏️ 手動刻印</button>
                  <div class="recorded-time-label" id="time-label-${i}">未記録</div>
              </div>
          `;
          container.appendChild(row);
        }
      }

      // イベント記録処理
      async function recordEvent(questionId, eventType, specifiedISOString = null) {
        if (!isSessionActive) {
          alert('先にセッションを設定してください。');
          return;
        }

        const payload = {
          session_id: currentSessionId,
          question_id: questionId,
          event_type: eventType,
          client_time: new Date().toISOString(),
          replace_existing: true
        };

        if (specifiedISOString) {
          payload.manual_time = specifiedISOString;
        }

        // 動画がセットされていれば再生位置（秒）を記録
        if (videoPlayer.src) {
          payload.video_time_sec = videoPlayer.currentTime;
        }

        try {
          const res = await fetch('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.ok) {
            refreshEventsList();
            if (questionId === 9 && eventType === 'participant_answer_end') {
              showCompletionNotice();
            }
          }
        } catch (err) {
          console.error('送信エラー:', err);
        }
      }

      // 手動時刻入力
      function manualTimeInput(questionId) {
        const inputTime = prompt(`質問 ${questionId} の刻印時刻を直接指定してください (形式: HH:MM:SS)`, '12:00:00');
        if (!inputTime) return;

        const typeChoice = confirm('「質問終了」として記録しますか？\n（[OK] = 質問終了, [キャンセル] = 解答終了）')
          ? 'interviewer_question_end'
          : 'participant_answer_end';

        const today = new Date().toISOString().split('T')[0];
        const targetISO = new Date(`${today}T${inputTime}Z`).toISOString();

        recordEvent(questionId, typeChoice, targetISO);
      }

      // Undo 処理
      async function undoLastOperation() {
        if (!isSessionActive) return;
        try {
          const res = await fetch('/api/events/undo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSessionId })
          });
          const data = await res.json();
          if (data.ok) {
            refreshEventsList();
          }
        } catch (err) {
          console.error(err);
        }
      }

      // 状態・ボタン表示書き換え
      async function refreshEventsList() {
        if (!isSessionActive) return;
        try {
          const res = await fetch(`/api/events?session_id=${encodeURIComponent(currentSessionId)}`);
          const data = await res.json();
          if (!data.events) return;

          for (let i = 1; i <= 9; i++) {
            const btnQ = document.getElementById(`btn-q-${i}`);
            const btnA = document.getElementById(`btn-a-${i}`);
            btnQ.className = 'btn-q';
            btnQ.innerText = '質問終了';
            btnA.className = 'btn-a';
            btnA.innerText = '解答終了';
            document.getElementById(`time-label-${i}`).innerText = '未記録';
          }

          const eventSummary = {};
          data.events.forEach((ev) => {
            const q = ev.question_id;
            if (!eventSummary[q]) eventSummary[q] = {};

            const timeStr = new Date(ev.server_time).toLocaleTimeString('ja-JP');
            const videoSecStr =
              ev.video_time_sec !== null && ev.video_time_sec !== undefined
                ? ` (${ev.video_time_sec.toFixed(1)}秒位置)`
                : '';

            if (ev.event_type === 'interviewer_question_end' || ev.event_type === 'question_end') {
              eventSummary[q].qTime = timeStr + videoSecStr;
            }
            if (ev.event_type === 'participant_answer_end') {
              eventSummary[q].aTime = timeStr + videoSecStr;
            }
          });

          for (let i = 1; i <= 9; i++) {
            const btnQ = document.getElementById(`btn-q-${i}`);
            const btnA = document.getElementById(`btn-a-${i}`);
            const label = document.getElementById(`time-label-${i}`);
            const info = eventSummary[i];

            let labelTexts = [];

            if (info && info.qTime) {
              btnQ.className = 'btn-q recorded';
              btnQ.innerText = '✓ 質問終了 (更新可)';
              labelTexts.push(`問終: ${info.qTime}`);
            }
            if (info && info.aTime) {
              btnA.className = 'btn-a recorded';
              btnA.innerText = '✓ 解答終了 (更新可)';
              labelTexts.push(`答終: ${info.aTime}`);
            }

            if (labelTexts.length > 0) {
              label.innerHTML = labelTexts.join('<br>');
              label.style.color = '#2b6cb0';
            }
          }
        } catch (err) {
          console.error(err);
        }
      }

      function showCompletionNotice() {
        document.getElementById('completion-notice').innerHTML = `
                <div style="background-color: #e6fffa; border: 1px solid #38b2ac; padding: 12px; border-radius: 6px; text-align: center;">
                    <p style="margin: 0 0 6px 0; font-weight: bold; color: #234e52;">🎉 9問目の回答終了が記録されました。</p>
                    <button class="btn-csv" onclick="downloadCSV()">📥 イベントCSVを出力してダウンロード</button>
                </div>
            `;
      }

      function downloadCSV() {
        if (!currentSessionId) return;
        window.location.href = `/api/sessions/${encodeURIComponent(currentSessionId)}/export.csv`;
      }
    </script>
  </body>
</html>
