<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>面接タイムスタンプ・動画区切り記録ツール</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f4f6f8;
        color: #333;
      }
      h1 {
        border-bottom: 3px solid #3182ce;
        padding-bottom: 8px;
        color: #2b6cb0;
        font-size: 24px;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
        margin-bottom: 20px;
      }
      .flex-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      input[type='text'],
      input[type='time'] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 15px;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 4px;
        font-weight: bold;
        padding: 8px 14px;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-set {
        background-color: #3182ce;
        color: white;
      }
      .btn-undo {
        background-color: #e53e3e;
        color: white;
      }
      .btn-csv {
        background-color: #319795;
        color: white;
        font-size: 16px;
        padding: 10px 20px;
      }

      /* 質問ボタンの状態スタイル */
      .btn-q {
        background-color: #ed8936;
        color: white;
        margin-right: 6px;
      }
      .btn-q.recorded {
        background-color: #c05621;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      }
      .btn-a {
        background-color: #38a169;
        color: white;
      }
      .btn-a.recorded {
        background-color: #22543d;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      .question-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .q-title {
        font-weight: bold;
        width: 70px;
        font-size: 16px;
      }
      .recorded-time-label {
        font-size: 12px;
        color: #4a5568;
        margin-top: 4px;
      }

      /* 動画プレイヤーエリア */
      .video-section {
        background-color: #edf2f7;
        padding: 15px;
        border-radius: 6px;
        margin-top: 15px;
      }
      video {
        width: 100%;
        max-height: 360px;
        background: black;
        border-radius: 4px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>🎙️ 面接タイムスタンプ & 動画区切り記録ツール</h1>

    <!-- 1. セッション初期化 -->
    <div class="card">
      <div class="flex-between">
        <div>
          <label for="session-id" style="font-weight: bold">被験者ID (セッション): </label>
          <input type="text" id="session-id" value="user_001" placeholder="例: user_001" />
          <button class="btn-set" onclick="initSession()">確定・開始</button>
        </div>
        <div>
          <button class="btn-undo" id="btn-undo-top" onclick="undoLastOperation()" disabled>
            ↩️ 直前の記録を取り消す (Undo)
          </button>
          <button class="btn-csv" id="btn-csv-top" onclick="downloadCSV()" disabled>📥 CSV出力</button>
        </div>
      </div>
      <p id="session-status" style="margin: 8px 0 0 0; color: #e53e3e; font-weight: bold">
        ※「確定・開始」ボタンを押すまで操作できません。
      </p>
    </div>

    <!-- 2. 面接録画動画からの手動刻印モード（オプション） -->
    <div class="card">
      <details>
        <summary style="font-weight: bold; cursor: pointer; color: #2b6cb0">
          📹 事前録画した動画を見ながら後から区切る（クリックして開く）
        </summary>
        <div class="video-section">
          <p style="margin: 0 0 8px 0; font-size: 13px; color: #4a5568">
            事前に撮影した面接動画（MP4等）を読み込み、再生しながら下のボタンを押すと、**動画の再生位置（秒数）**を記録できます。
          </p>
          <input type="file" id="video-input" accept="video/*" onchange="loadVideo(event)" />
          <br />
          <video id="video-player" controls></video>
          <div style="margin-top: 6px; font-weight: bold; color: #2d3748" id="video-time-display">
            再生時間: 00:00.0
          </div>
        </div>
      </details>
    </div>

    <!-- 3. 質問記録テーブル -->
    <div class="card">
      <h2>質問コントロール (全9問)</h2>
      <div id="questions-container"></div>
      <div id="completion-notice" style="margin-top: 15px"></div>
    </div>

    <script>
      let currentSessionId = '';
      let isSessionActive = false;
      const videoPlayer = document.getElementById('video-player');

      // 動画時間の同期表示
      videoPlayer.ontimeupdate = function () {
        const sec = videoPlayer.currentTime;
        const m = Math.floor(sec / 60)
          .toString()
          .padStart(2, '0');
        const s = (sec % 60).toFixed(1).padStart(4, '0');
        document.getElementById('video-time-display').innerText = `再生時間: ${m}:${s} (${sec.toFixed(2)}秒)`;
      };

      // 動画ファイルの読み込み処理（黒画面防止・メモリ最適化版）
      function loadVideo(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 1. 以前生成したURLがあればメモリ解放してクリア
        if (videoPlayer.src && videoPlayer.src.startsWith('blob:')) {
          URL.revokeObjectURL(videoPlayer.src);
        }

        // 2. 新しい Blob URL を生成してセット
        const videoURL = URL.createObjectURL(file);
        videoPlayer.src = videoURL;

        // 3. 動画要素を明示的にロード
        videoPlayer.load();

        // 4. メタデータ読み込み成功時の処理（1フレーム目を画面表示）
        videoPlayer.onloadedmetadata = function () {
          // 再生位置を0秒にセットして1フレーム目を描画
          videoPlayer.currentTime = 0;
          console.log('動画の読み込みに成功しました:', file.name);
        };

        // 5. コーデック非対応などのエラーハンドリング
        videoPlayer.onerror = function () {
          console.error('動画読み込みエラー:', videoPlayer.error);
          alert(
            '⚠️ 動画を表示できませんでした。\n\n' +
              '【考えられる原因】\n' +
              '・ブラウザが対応していない形式（.mov / HEVC(H.265) 等）です。\n' +
              '・H.264形式の .mp4 ファイルに変換して再度お試しください。'
          );
        };
      }

      window.onload = function () {
        generateQuestionRows();
      };

      // セッション確定
      async function initSession() {
        const inputVal = document.getElementById('session-id').value.trim();
        if (!inputVal) {
          alert('セッションIDを入力してください。');
          return;
        }
        try {
          const res = await fetch('/api/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: inputVal })
          });
          const data = await res.json();
          if (data.session_id) {
            currentSessionId = data.session_id;
            isSessionActive = true;
            document.getElementById('session-status').innerText = `✅ セッション設定完了: ${currentSessionId}`;
            document.getElementById('session-status').style.color = '#2b6cb0';

            // ボタンの有効化
            toggleControlButtons(true);
            refreshEventsList();
          }
        } catch (err) {
          alert('通信エラーが発生しました。');
        }
      }

      function toggleControlButtons(enable) {
        document.getElementById('btn-undo-top').disabled = !enable;
        document.getElementById('btn-csv-top').disabled = !enable;
        for (let i = 1; i <= 9; i++) {
          document.getElementById(`btn-q-${i}`).disabled = !enable;
          document.getElementById(`btn-a-${i}`).disabled = !enable;
          document.getElementById(`btn-manual-${i}`).disabled = !enable;
        }
      }

      // 9問分のUI要素生成
      function generateQuestionRows() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        for (let i = 1; i <= 9; i++) {
          const row = document.createElement('div');
          row.className = 'question-row';
          row.innerHTML = `
                    <div class="q-title">質問 ${i}</div>
                    <div>
                        <button class="btn-q" id="btn-q-${i}" onclick="recordEvent(${i}, 'interviewer_question_end')" disabled>質問終了</button>
                        <button class="btn-a" id="btn-a-${i}" onclick="recordEvent(${i}, 'participant_answer_end')" disabled>解答終了</button>
                    </div>
                    <div style="text-align: right;">
                        <button id="btn-manual-${i}" onclick="manualTimeInput(${i})" style="font-size: 11px; background: #e2e8f0;" disabled>✏️ 手動刻印/修正</button>
                        <div class="recorded-time-label" id="time-label-${i}">未記録</div>
                    </div>
                `;
          container.appendChild(row);
        }
      }

      // イベント記録処理（押し直し・動画位置同期対応）
      async function recordEvent(questionId, eventType, specifiedISOString = null) {
        if (!isSessionActive) {
          alert('先にセッションを設定してください。');
          return;
        }

        const payload = {
          session_id: currentSessionId,
          question_id: questionId,
          event_type: eventType,
          client_time: new Date().toISOString(),
          replace_existing: true
        };

        // 指定手動時刻がある場合
        if (specifiedISOString) {
          payload.manual_time = specifiedISOString;
        }

        // 動画が読み込まれて再生中の場合、動画の現在位置（秒）を送信
        if (videoPlayer.src && !videoPlayer.paused) {
          payload.video_time_sec = videoPlayer.currentTime;
        }

        try {
          const res = await fetch('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await res.json();
          if (data.ok) {
            refreshEventsList();
            if (questionId === 9 && eventType === 'participant_answer_end') {
              showCompletionNotice();
            }
          }
        } catch (err) {
          console.error('送信エラー:', err);
        }
      }

      // 人の手による手動時刻修正（hh:mm:ss 入力ダイアログ）
      function manualTimeInput(questionId) {
        const inputTime = prompt(`質問 ${questionId} の刻印時刻を直接指定してください (形式: HH:MM:SS)`, '12:00:00');
        if (!inputTime) return;

        const typeChoice = confirm('「質問終了」として記録しますか？\n（[OK] = 質問終了, [キャンセル] = 解答終了）')
          ? 'interviewer_question_end'
          : 'participant_answer_end';

        // 今日の日付と結合して ISO フォーマット生成
        const today = new Date().toISOString().split('T')[0];
        const targetISO = new Date(`${today}T${inputTime}Z`).toISOString();

        recordEvent(questionId, typeChoice, targetISO);
      }

      // Undo 処理
      async function undoLastOperation() {
        if (!isSessionActive) return;
        try {
          const res = await fetch('/api/events/undo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: currentSessionId })
          });
          const data = await res.json();
          if (data.ok) {
            refreshEventsList();
          }
        } catch (err) {
          console.error(err);
        }
      }

      // 状態および画面表示（ボタン色・テキスト・更新時刻）のリアルタイム書き換え
      async function refreshEventsList() {
        if (!isSessionActive) return;
        try {
          const res = await fetch(`/api/events?session_id=${encodeURIComponent(currentSessionId)}`);
          const data = await res.json();
          if (!data.events) return;

          // 表示リセット
          for (let i = 1; i <= 9; i++) {
            const btnQ = document.getElementById(`btn-q-${i}`);
            const btnA = document.getElementById(`btn-a-${i}`);
            btnQ.className = 'btn-q';
            btnQ.innerText = '質問終了';
            btnA.className = 'btn-a';
            btnA.innerText = '解答終了';
            document.getElementById(`time-label-${i}`).innerText = '未記録';
          }

          // イベント情報の反映（最新の押し直し結果を表示）
          const eventSummary = {};
          data.events.forEach((ev) => {
            const q = ev.question_id;
            if (!eventSummary[q]) eventSummary[q] = {};

            const timeStr = new Date(ev.server_time).toLocaleTimeString('ja-JP');
            const videoSecStr = ev.video_time_sec ? ` (${ev.video_time_sec.toFixed(1)}秒位置)` : '';

            if (ev.event_type === 'interviewer_question_end' || ev.event_type === 'question_end') {
              eventSummary[q].qTime = timeStr + videoSecStr;
            }
            if (ev.event_type === 'participant_answer_end') {
              eventSummary[q].aTime = timeStr + videoSecStr;
            }
          });

          for (let i = 1; i <= 9; i++) {
            const btnQ = document.getElementById(`btn-q-${i}`);
            const btnA = document.getElementById(`btn-a-${i}`);
            const label = document.getElementById(`time-label-${i}`);
            const info = eventSummary[i];

            let labelTexts = [];

            if (info && info.qTime) {
              btnQ.className = 'btn-q recorded';
              btnQ.innerText = '✓ 質問終了 (更新可)';
              labelTexts.push(`問終: ${info.qTime}`);
            }
            if (info && info.aTime) {
              btnA.className = 'btn-a recorded';
              btnA.innerText = '✓ 解答終了 (更新可)';
              labelTexts.push(`答終: ${info.aTime}`);
            }

            if (labelTexts.length > 0) {
              label.innerHTML = labelTexts.join('<br>');
              label.style.color = '#2b6cb0';
            }
          }
        } catch (err) {
          console.error(err);
        }
      }

      function showCompletionNotice() {
        document.getElementById('completion-notice').innerHTML = `
                <div style="background-color: #e6fffa; border: 1px solid #38b2ac; padding: 12px; border-radius: 6px; text-align: center;">
                    <p style="margin: 0 0 6px 0; font-weight: bold; color: #234e52;">🎉 9問目の回答終了が記録されました。</p>
                    <button class="btn-csv" onclick="downloadCSV()">📥 イベントCSVを出力してダウンロード</button>
                </div>
            `;
      }

      function downloadCSV() {
        if (!currentSessionId) return;
        window.location.href = `/api/sessions/${encodeURIComponent(currentSessionId)}/export.csv`;
      }
    </script>
  </body>
</html>
